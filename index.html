  html[data-tod="dawn"] {
    --ink:#3a2740; --ink-soft:rgba(58,39,64,0.66); --ink-faint:rgba(58,39,64,0.4);

    --glass-bg:rgba(255,250,251,0.46); --glass-bg-strong:rgba(255,250,251,0.7);

  body {
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--page-bg);

  #root { min-height: 100vh; }
  ::selection { background: var(--accent); color: #fff; }

  a { color: inherit; text-decoration: none; }

  ::-webkit-scrollbar { width: 11px; }

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- scenes: animated sea + sky engine -->
  <script type="text/babel">
/* ============================================================
   Grammar Gate — animated sea + sky scene engine
   ============================================================ */

const HORIZON = 60;

const TOD = {
  dawn: {
    sky: "linear-gradient(180deg,#5b4d86 0%,#9b7bb0 26%,#dc9bb4 52%,#f8bfae 76%,#ffe2c4 100%)",
    sea: "linear-gradient(180deg,#e6b1c2 0%,#c79bc6 42%,#9b86bd 100%)",
    sun: { left: "24%", top: "46%", color: "#fff0d6", glow: "#ffcaa8", size: 132, op: 1 },
    moonOp: 0, starOp: 0.12, cloudOp: 0.9, cloudTint: "#ffe6ea",
    silhouette: "#5a4a70", silhouetteSoft: "#7a6a90",
    reflection: "rgba(255,224,196,0.55)", haze: "rgba(255,210,200,0.35)"
  },
  day: {
    sky: "linear-gradient(180deg,#2f86d4 0%,#5aa9e4 34%,#93cdee 64%,#cdeef8 100%)",
    sea: "linear-gradient(180deg,#86d6ea 0%,#39a9d0 48%,#1c7ba0 100%)",
    sun: { left: "72%", top: "20%", color: "#fffbe9", glow: "#ffe9a8", size: 116, op: 1 },
    moonOp: 0, starOp: 0, cloudOp: 1, cloudTint: "#ffffff",
    silhouette: "#3f6f86", silhouetteSoft: "#5d92a8",
    reflection: "rgba(255,247,214,0.5)", haze: "rgba(190,232,245,0.4)"
  },
  dusk: {
    sky: "linear-gradient(180deg,#241a48 0%,#5c2f6e 32%,#a8456c 58%,#e07457 80%,#f6b46a 100%)",
    sea: "linear-gradient(180deg,#c98368 0%,#7c4a6e 46%,#33274f 100%)",
    sun: { left: "78%", top: "50%", color: "#ffd9a0", glow: "#ff8e54", size: 138, op: 1 },
    moonOp: 0.25, starOp: 0.45, cloudOp: 0.85, cloudTint: "#f0b48f",
    silhouette: "#2c1f3e", silhouetteSoft: "#4a3358",
    reflection: "rgba(255,150,90,0.5)", haze: "rgba(170,90,110,0.3)"
  },
  night: {
    sky: "linear-gradient(180deg,#060b20 0%,#0e1d3e 40%,#163a52 74%,#235e6c 100%)",
    sea: "linear-gradient(180deg,#2a5a68 0%,#143a4e 48%,#081d2e 100%)",
    sun: { left: "70%", top: "16%", color: "#1a2440", glow: "#1a2440", size: 0, op: 0 },
    moonOp: 1, starOp: 1, cloudOp: 0.5, cloudTint: "#1d3350",
    silhouette: "#0a1626", silhouetteSoft: "#16283e",
    reflection: "rgba(180,225,240,0.4)", haze: "rgba(30,70,90,0.4)"
  }
};
const TOD_KEYS = ["dawn", "day", "dusk", "night"];

const STARS = Array.from({ length: 130 }, () => ({
  x: Math.random() * 100,
  y: Math.random() * (HORIZON - 4),
  s: Math.random() * 1.8 + 0.6,
  d: Math.random() * 4,
  b: 0.5 + Math.random() * 0.5
}));

function SceneStyles() {
  return (
    <style>{`
    .gg-scene{position:absolute;inset:0;overflow:hidden;}
    .gg-layer{position:absolute;inset:0;transition:opacity 1.15s ease;}
    .gg-sky{height:${HORIZON + 2}%;top:0;}
    .gg-sea-wrap{position:absolute;left:0;right:0;bottom:0;height:${100 - HORIZON}%;overflow:hidden;-webkit-transform:translateZ(0);transform:translateZ(0);}
    .gg-sea{position:absolute;inset:0;transition:opacity 1.15s ease;}
    .gg-sun{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
      transition:left 1.2s ease,top 1.2s ease,background 1.2s ease,box-shadow 1.2s ease,width 1.2s ease,height 1.2s ease,opacity 1.2s ease;
      will-change:left,top;}
    .gg-moon{position:absolute;width:84px;height:84px;border-radius:50%;
      transform:translate(-50%,-50%);transition:opacity 1.2s ease,left 1.2s ease,top 1.2s ease;
      background:radial-gradient(circle at 38% 34%,#fdfdf5 0%,#e6ecf5 55%,#c4d0e0 100%);
      box-shadow:0 0 50px 12px rgba(210,225,245,0.5),inset -10px -8px 0 -4px rgba(150,170,200,0.35);}
    .gg-star{position:absolute;border-radius:50%;background:#fff;animation:ggtwinkle 4s ease-in-out infinite;}
    @keyframes ggtwinkle{0%,100%{opacity:.25;}50%{opacity:1;}}
    .gg-stars{transition:opacity 1.4s ease;}
    .gg-cloud-track{position:absolute;left:0;will-change:transform;}
    .gg-cloud{position:absolute;filter:blur(2px);transform-origin:left center;opacity:.92;}
    .gg-cloud b{position:absolute;border-radius:50%;display:block;}
    .gg-drift1{animation:ggdrift 90s linear infinite;}
    .gg-drift2{animation:ggdrift 130s linear infinite;}
    .gg-drift3{animation:ggdrift 70s linear infinite;}
    @keyframes ggdrift{from{transform:translateX(-28vw);}to{transform:translateX(128vw);}}
    .gg-reflect{position:absolute;top:0;width:120px;height:78%;transform:translateX(-50%);
      filter:blur(7px);transition:left 1.2s ease,background 1.2s ease,opacity 1.2s ease;
      animation:ggshimmer 5s ease-in-out infinite;mix-blend-mode:screen;}
    @keyframes ggshimmer{0%,100%{opacity:.5;transform:translateX(-50%) scaleX(1);}50%{opacity:.85;transform:translateX(-50%) scaleX(1.25);}}
    .gg-wave{position:absolute;left:0;width:200%;animation:ggwave linear infinite;will-change:transform;}
    @keyframes ggwave{from{transform:translate3d(0,0,0);}to{transform:translate3d(-50%,0,0);}}
    .gg-boat{position:absolute;animation:ggbob 6s ease-in-out infinite;transform-origin:center bottom;will-change:transform;}
    @keyframes ggbob{0%,100%{transform:translateY(0) rotate(-1.2deg);}50%{transform:translateY(-7px) rotate(1.2deg);}}
    .gg-boat-far{animation:ggbob 8s ease-in-out infinite;}
    .gg-sail-track{position:absolute;left:0;will-change:transform;animation:ggsail 26s linear infinite;}
    @keyframes ggsail{from{transform:translateX(-18vw);}to{transform:translateX(118vw);}}
    .gg-sail-track .gg-boat{position:relative;left:0;bottom:0;}
    .gg-sailmove{position:absolute;left:0;will-change:transform;animation:ggsailmove linear infinite;}
    @keyframes ggsailmove{from{transform:translateX(var(--from,-15vw));}to{transform:translateX(var(--to,115vw));}}
    .gg-sailmove .gg-boat{position:relative;left:auto;bottom:auto;}
    .gg-beacon-beam{position:absolute;transform-origin:left center;filter:blur(6px);
      mix-blend-mode:screen;pointer-events:none;
      animation:ggsweep 8.5s ease-in-out infinite;will-change:transform;}
    @keyframes ggsweep{0%,100%{transform:translateY(-50%) rotate(var(--restdeg,-30deg));}
      50%{transform:translateY(-50%) rotate(var(--topdeg,12deg));}}
    .gg-bird{position:absolute;animation:ggfly 30s linear infinite;will-change:transform;}
    @keyframes ggfly{from{transform:translate(-12vw,12px);}to{transform:translate(118vw,-46px);}}
    .gg-bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.85),rgba(255,255,255,.05));
      border:1px solid rgba(255,255,255,.35);animation:ggrise linear infinite;will-change:transform,opacity;}
    @keyframes ggrise{0%{transform:translateY(0) translateX(0);opacity:0;}10%{opacity:.8;}100%{transform:translateY(-340px) translateX(18px);opacity:0;}}
    .gg-ray{position:absolute;transform-origin:top center;mix-blend-mode:screen;
      background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));animation:ggraypulse 7s ease-in-out infinite;}
    @keyframes ggraypulse{0%,100%{opacity:.35;}50%{opacity:.7;}}
    .gg-current{position:absolute;height:9px;border-radius:50%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
      filter:blur(6px);mix-blend-mode:screen;pointer-events:none;
      will-change:transform,opacity;animation:ggcurrent linear infinite;}
    @keyframes ggcurrent{0%{transform:translateX(-70vw);opacity:0;}
      14%{opacity:var(--op,.5);}86%{opacity:var(--op,.5);}100%{transform:translateX(170vw);opacity:0;}}
    .gg-glasspanel{position:absolute;border-radius:20px;border:1px solid rgba(255,255,255,.5);
      background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.06));
      backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);box-shadow:0 16px 50px -18px rgba(0,40,60,.5);
      animation:ggfloat 9s ease-in-out infinite;will-change:transform;}
    @keyframes ggfloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg));}50%{transform:translateY(-16px) rotate(var(--r,0deg));}}
    .gg-haze{position:absolute;left:0;right:0;height:14%;top:${HORIZON - 7}%;transition:background 1.2s ease;pointer-events:none;}
    .gg-scene.is-static *{animation-delay:-9s!important;animation-play-state:paused!important;}
    @media (prefers-reduced-motion: reduce){
      .gg-drift1,.gg-drift2,.gg-drift3,.gg-boat,.gg-bird,.gg-bubble,.gg-ray,.gg-glasspanel,.gg-reflect,.gg-star,.gg-wave,.gg-sailmove,.gg-beacon-beam,.gg-current{animation:none!important;}
    }
    `}</style>
  );
}

function Sky({ tod }) {
  return (
    <div className="gg-layer gg-sky">
      {TOD_KEYS.map((k) =>
        <div key={k} className="gg-layer" style={{ background: TOD[k].sky, opacity: tod === k ? 1 : 0 }} />
      )}
    </div>
  );
}

function Stars({ tod }) {
  return (
    <div className="gg-layer gg-stars" style={{ height: `${HORIZON}%`, opacity: TOD[tod].starOp }}>
      {STARS.map((s, i) =>
        <span key={i} className="gg-star" style={{
          left: `${s.x}%`, top: `${s.y}%`, width: s.s, height: s.s,
          animationDelay: `${s.d}s`, opacity: s.b
        }} />
      )}
    </div>
  );
}

function Celestial({ tod }) {
  const s = TOD[tod].sun;
  return (
    <React.Fragment>
      <div className="gg-sun" style={{
        left: s.left, top: s.top, width: s.size, height: s.size, opacity: s.op,
        background: `radial-gradient(circle at 50% 50%, #fff 0%, ${s.color} 42%, ${s.glow} 100%)`,
        boxShadow: `0 0 90px 30px ${s.glow}99, 0 0 200px 80px ${s.glow}55`
      }} />
      <div className="gg-moon" style={{ left: tod === "night" ? "26%" : "70%", top: "18%", opacity: TOD[tod].moonOp }} />
    </React.Fragment>
  );
}

function Cloud({ tint, blobs, scale, top, delay, cls }) {
  return (
    <div className={`gg-cloud-track ${cls}`} style={{ top, animationDelay: delay }}>
      <div className="gg-cloud" style={{ transform: `scale(${scale})` }}>
        {blobs.map((b, i) =>
          <b key={i} style={{
            left: b.x, top: b.y, width: b.w, height: b.h,
            background: tint, boxShadow: `0 8px 30px -6px ${tint}`
          }} />
        )}
      </div>
    </div>
  );
}
const CLOUD_SHAPE = [
  { x: 0, y: 18, w: 70, h: 44 }, { x: 38, y: 4, w: 92, h: 62 },
  { x: 104, y: 16, w: 76, h: 48 }, { x: 150, y: 26, w: 64, h: 38 }
];

function Clouds({ tod }) {
  const t = TOD[tod];
  const defs = [
    { top: "10%", scale: 1.1, cls: "gg-drift1", delay: "-12s" },
    { top: "24%", scale: 0.7, cls: "gg-drift2", delay: "-60s" },
    { top: "6%", scale: 0.85, cls: "gg-drift3", delay: "-30s" },
    { top: "34%", scale: 0.55, cls: "gg-drift2", delay: "-95s" }
  ];
  return (
    <div className="gg-layer" style={{ height: `${HORIZON}%`, opacity: t.cloudOp }}>
      {defs.map((d, i) =>
        <Cloud key={i} tint={t.cloudTint} blobs={CLOUD_SHAPE} cls={d.cls}
          scale={d.scale} top={d.top} delay={d.delay} />
      )}
    </div>
  );
}

function Sea({ tod }) {
  const t = TOD[tod];
  const s = TOD[tod].sun;
  return (
    <div className="gg-sea-wrap">
      {TOD_KEYS.map((k) =>
        <div key={k} className="gg-sea" style={{ background: TOD[k].sea, opacity: tod === k ? 1 : 0 }} />
      )}
      <div className="gg-reflect" style={{
        left: s.op > 0 ? s.left : tod === "night" ? "26%" : "70%",
        background: `linear-gradient(180deg, ${t.reflection} 0%, rgba(255,255,255,0) 100%)`,
        opacity: 0.8
      }} />
      <WaveBand color="rgba(255,255,255,0.18)" top="2%" dur="11s" h={26} />
      <WaveBand color="rgba(255,255,255,0.12)" top="20%" dur="15s" h={34} />
      <WaveBand color="rgba(0,30,45,0.16)" top="46%" dur="19s" h={46} />
    </div>
  );
}

function Currents() {
  const lanes = [
    { top: "22%", w: "42vw", dur: "17s", delay: "0s", op: 0.5 },
    { top: "42%", w: "56vw", dur: "23s", delay: "-8s", op: 0.4 },
    { top: "62%", w: "36vw", dur: "19s", delay: "-13s", op: 0.5 },
    { top: "80%", w: "60vw", dur: "27s", delay: "-5s", op: 0.34 }
  ];
  return (
    <React.Fragment>
      {lanes.map((l, i) =>
        <span key={i} className="gg-current" style={{
          top: l.top, width: l.w, "--op": l.op,
          animationDuration: l.dur, animationDelay: l.delay
        }} />
      )}
    </React.Fragment>
  );
}

const WAVE_D = (() => {
  let d = "M0,30";
  for (let x = 0; x < 2400; x += 200) d += ` C${x + 50},8 ${x + 150},52 ${x + 200},30`;
  return d + " L2400,60 L0,60 Z";
})();

function WaveBand({ color, top, dur, h }) {
  return (
    <svg className="gg-wave" style={{ top, height: h, animationDuration: dur }}
      viewBox="0 0 2400 60" preserveAspectRatio="none">
      <path d={WAVE_D} fill={color} />
    </svg>
  );
}

const MTN = {
  range: {
    far: "M0,220 L0,150 Q120,92 250,132 Q380,168 500,112 Q640,52 780,124 Q900,170 1030,108 Q1120,74 1200,120 L1200,220 Z",
    near: "M0,220 L0,182 Q150,120 320,172 Q470,214 600,150 Q740,92 880,162 Q1010,210 1120,150 Q1165,128 1200,166 L1200,220 Z"
  },
  alpine: {
    far: "M0,220 L0,158 L120,150 L250,92 L360,150 L470,70 L590,150 L710,86 L840,150 L980,80 L1100,150 L1200,118 L1200,220 Z",
    near: "M0,220 L0,178 L150,168 L330,58 L470,168 L600,150 L770,40 L930,168 L1060,128 L1180,86 L1200,96 L1200,220 Z",
    caps: [
      "M299,98 L330,58 L362,99 L350,90 L342,101 L332,92 L322,102 L311,92 L299,98 Z",
      "M739,82 L770,40 L802,86 L790,77 L782,89 L772,79 L762,91 L751,80 L739,82 Z"

  },
  volcanic: {

    near: "M0,220 L0,200 L150,150 L228,108 L262,116 L320,156 L560,196 L705,74 L745,90 L790,76 L1000,196 L1080,150 L1140,114 L1176,122 L1200,160 L1200,220 Z",
    vent: { x: 747, y: 86 }
  }
};

function Mountains({ tod }) {
  const t = TOD[tod];
  return (
    <svg style={{ position: "absolute", left: 0, right: 0, bottom: `${100 - HORIZON}%`, width: "100%", height: "26%" }}
      viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0,200 L0,120 L120,60 L240,110 L360,40 L520,120 L680,70 L820,130 L980,80 L1120,120 L1200,90 L1200,200 Z"
        fill={t.silhouetteSoft} opacity="0.55" style={{ transition: "fill 1.2s ease", opacity: "1" }} />

    /* the harbour: the Introduction card and the vessel, afloat at the surface */
    .gg-harbor{

    .gg-grid{

    .gg-card{

    /* ---- grammar roadmap (winding road) ---- */
    .gg-roadmap{ position:relative;max-width:1000px;margin:0 auto;padding:8px 0 100px; }
    /* the dive line / mooring cable descending into the dark */
    .gg-road{
      position:absolute;left:50%;top:calc(2px - var(--shallow));bottom:74px;width:3px;transform:translateX(-50%);
      border-radius:3px;z-index:1;
      background:linear-gradient(180deg,
        rgba(190,240,250,.85) 0%, rgba(120,205,228,.72) 20%, rgba(60,150,188,.6) 42%,
        rgba(42,112,162,.6) 60%, rgba(90,200,232,.78) 82%, rgba(174,246,255,.96) 100%);
      box-shadow:0 0 12px 1px rgba(120,215,242,.4), 0 0 32px 4px rgba(90,190,228,.18);

    .gg-road::before{
      content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);

       Sunlight Zone sits at ~45%, Twilight Zone at ~63%, then
       Midnight/Abyssal/Hadal pack into 70–85% and the floor is 100%.
       Warm light (dawn/dusk) holds through the Sunlight Zone and only
       breaks to blue at the Twilight Zone; every zone below gets darker. */

    .gg-dbg-day{

        #00080e 73%, #00050a 80%, #000307 90%, #000204 100%);

       only fades to blue around the twilight zone, then deepens to black */
    .gg-dbg-dawn{
      background:linear-gradient(180deg,
        #ffe6da 0%, #fbd9d2 9%, #f3ccca 18%, #e3c0c2 26%, #c8b8bb 33%,
        #a3a8b0 38%, #8298a6 42%, #5d80a0 45%, #3f5a7a 48%, #264162 52%,
        #14304a 56%, #0a1d2e 59%, #06141f 64%, #040d18 69%, #020912 75%,
        #01060d 81%, #000409 90%, #000205 100%);

    /* DUSK — warm amber sunset holds through the shallows, then drops
       to blue around the twilight zone and into the deep */
    .gg-dbg-dusk{
      background:linear-gradient(180deg,
        #ffd9a6 0%, #f7bd8e 9%, #ec9f86 18%, #d99b8e 26%, #bb9a93 33%,
        #9a9aa0 38%, #7d92a2 42%, #5d80a0 45%, #3f5a7a 48%, #264162 52%,
        #14304a 56%, #0a1d2e 59%, #06141f 64%, #040d18 69%, #020912 75%,
        #01060d 81%, #000409 90%, #000205 100%);

    .gg-dbg-night{
      background:linear-gradient(180deg,
        #1f5560 0%, #184550 10%, #133842 20%, #0d2933 30%, #0a222c 38%,
        #081a23 44%, #06141b 48%, #050f15 53%, #03090f 59%, #02060a 66%,

    .gg-deep-fx{

    /* god rays — fade out as the light runs out */
    .gg-rays{ position:absolute;inset:0;opacity:min(calc(var(--dive-p,0) * 14), max(0, calc(.9 - var(--dive-p,0) * 1.85))); }
    .gg-ray2{

      background:linear-gradient(180deg, rgba(215,248,255,.45), rgba(180,238,255,0) 72%);
      filter:blur(16px);mix-blend-mode:screen;animation:ggray2 9s ease-in-out infinite;
    }
    @keyframes ggray2{ 0%,100%{opacity:.55;} 50%{opacity:.95;} }

    /* marine snow — slow drifting particles, only once we're under the surface */
    .gg-snow{ position:absolute;inset:0;opacity:max(0, min(calc((var(--dive-p,0) - .06) * 5), .8)); }
    .gg-flake{
      position:absolute;top:-6vh;border-radius:50%;
      background:radial-gradient(circle at 34% 30%, #ffffff, rgba(255,255,255,.14));

    @keyframes ggfall{ 0%{transform:translate(0,-6vh);} 100%{transform:translate(var(--drift,0), 112vh);} }

    .gg-biodot{

    @keyframes ggbiopulse{ 0%,100%{opacity:.1;} 50%{opacity:1;} }
    @keyframes ggbiodrift{ 0%{transform:translateY(8px);} 100%{transform:translateY(-34px);} }

    /* deep-sea creatures — anchored to the water column (scroll past them),

    .gg-deep-life{ position:absolute;left:0;right:0;bottom:0;top:var(--surface-band-h,38%);z-index:1;pointer-events:none;overflow:hidden; }
    .gg-creature{ position:absolute;will-change:transform; }
    .gg-swimmer{

    .gg-glow{ filter:drop-shadow(0 0 5px var(--g,#9fe9f5)); }

    .gg-pressure-vignette{

      background:
        radial-gradient(130% 80% at 50% 38%, transparent 52%, rgba(0,4,12,.55) 100%),

    .gg-stage-side.is-deep .gg-pin{

    .gg-deep .gg-footer{ background:transparent;border-top-color:rgba(150,200,240,.16); }
    .gg-deep .gg-foot-bottom{ color:rgba(198,220,245,.55); }

      .gg-road::before,.gg-road-arrow,.gg-stage-side.is-deep{ animation:none!important; }
    }
    `}</style>
  );
}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

    </TweakRow>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;

            return <option key={v} value={v}>{l}</option>;

    );
  }

  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function useTilt(max = 9) {
  const ref = useRef(null);
  const onMove = useCallback((e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const ry = (px - 0.5) * 2 * max;
    const rx = -(py - 0.5) * 2 * max;
    el.style.transition = "transform .14s ease-out, box-shadow .4s ease";
    el.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-6px) scale(1.018)`;
    el.style.setProperty("--gx", `${px * 100}%`);
    el.style.setProperty("--gy", `${py * 100}%`);
  }, [max]);
  const onLeave = useCallback(() => {
    const el = ref.current; if (!el) return;
    el.style.transition = "transform .55s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease";
    el.style.transform = "perspective(900px) rotateX(0) rotateY(0) translateY(0) scale(1)";
  }, []);
  return { ref, onMouseMove: onMove, onMouseLeave: onLeave };
}

   so the content zone's depth colours track the chosen time of day */

  day:   { pin: ["#e0975a", "#19b3c4", "#1d86b4", "#1e5f9c", "#1c3f72", "#122a4d"],
           acc: ["#e0975a", "#2bbcce", "#37a6c8", "#52b6dd", "#69c8e8", "#8adcf5"] },

           acc: ["#7fe0ee", "#5fd3e6", "#52b6dd", "#69c8e8", "#8adcf5", "#aef0ff"] }
};

function useDeepDive(ref) {
  const [st, setSt] = useState({ depth: 0, pressure: 1, temp: 23, light: 100, zone: "Surface", zi: 0, visible: false });
  useEffect(() => {
    let raf = 0;
    let last = { depth: -1, zi: -1, visible: null };
    const ZON = ["Surface", "Sunlight Zone", "Twilight Zone", "Midnight Zone", "Abyssal Zone", "Hadal Zone"];
    const PIN_D = [0, 120, 600, 2600, 5000, 8200];
    const lerp = (a, b, t) => a + (b - a) * t;
    const c01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
    const tempAt = (d) => d <= 1000 ? lerp(23, 4, d / 1000) : d <= 4000 ? lerp(4, 2, (d - 1000) / 3000) : lerp(2, 1.6, c01((d - 4000) / 7000));
    const lightAt = (d) => d <= 10 ? 100 : d <= 200 ? lerp(62, 6, (d - 10) / 190) : d <= 1000 ? lerp(6, 0, (d - 200) / 800) : 0;
    const zoneOf = (d) => d <= 5 ? 0 : d <= 200 ? 1 : d <= 1000 ? 2 : d <= 4000 ? 3 : d <= 6000 ? 4 : 5;
    const root = document.documentElement;
    const calc = () => {
      raf = 0;
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight, focus = vh * 0.5;
      const p = c01((focus - r.top) / Math.max(1, r.height));
      root.style.setProperty("--dive-p", p.toFixed(4));
      const pins = el.querySelectorAll(".gg-pin");
      let depth = 0;
      if (pins.length) {
        const pts = [];
        pins.forEach((pn, i) => { const pr = pn.getBoundingClientRect(); pts.push({ y: pr.top + pr.height / 2, d: PIN_D[i] != null ? PIN_D[i] : 8200 }); });
        pts.push({ y: r.bottom, d: 10994 });
        if (focus <= pts[0].y) { depth = focus < r.top ? 0 : lerp(0, pts[0].d, c01((focus - r.top) / Math.max(1, pts[0].y - r.top))); }
        else if (focus >= pts[pts.length - 1].y) { depth = pts[pts.length - 1].d; }
        else { for (let i = 0; i < pts.length - 1; i++) { if (focus >= pts[i].y && focus <= pts[i + 1].y) { depth = lerp(pts[i].d, pts[i + 1].d, (focus - pts[i].y) / Math.max(1, pts[i + 1].y - pts[i].y)); break; } } }
      }
      const visible = r.top < vh * 0.9 && r.bottom > vh * 0.12;
      const zi = zoneOf(depth);
      const rd = Math.round(depth);
      if (visible !== last.visible) document.body.classList.toggle("gg-diving", visible);
      if (rd !== last.depth || zi !== last.zi || visible !== last.visible) {
        last = { depth: rd, zi, visible };
        setSt({
          depth: rd, pressure: Math.max(1, Math.round(1 + depth / 9.9)),
          temp: Math.round(tempAt(depth) * 10) / 10, light: Math.max(0, Math.round(lightAt(depth))),
          zone: ZON[zi], zi, visible
        });
      }
    };
    const onScroll = () => { if (!raf) raf = requestAnimationFrame(calc); };
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    let ro = null;
    if (window.ResizeObserver && ref.current) { ro = new ResizeObserver(onScroll); ro.observe(ref.current); }
    calc();
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
      if (ro) ro.disconnect();
      if (raf) cancelAnimationFrame(raf);
      document.body.classList.remove("gg-diving");
    };
  }, [ref]);
  return st;
}

      const band = el.querySelector('.gg-surface-band');
      if (band) el.style.setProperty('--surface-band-h', `${band.offsetTop + band.offsetHeight}px`);
    };
    measure();
    window.addEventListener('resize', measure);
    const ro = window.ResizeObserver ? new ResizeObserver(measure) : null;
    const band = deepRef.current && deepRef.current.querySelector('.gg-surface-band');
    if (ro && band) ro.observe(band);
    return () => { window.removeEventListener('resize', measure); if (ro) ro.disconnect(); };
  }, []);
  return (
    <div className="gg-deep" ref={deepRef}>
      <div className="gg-deep-bg">

  useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty("--font-display", FONT_STACKS[t.displayFont] || FONT_STACKS["Playfair Display"]);
    r.setProperty("--glass-blur", `${t.glassBlur}px`);
  }, [t.displayFont, t.glassBlur]);
  return (
    <React.Fragment>
      <SceneStyles />
      <AppStyles />
      <Nav tod={tod} setTod={setTod} sceneStyle={sceneStyle} setSceneStyle={setSceneStyle} mtn={mtn} setMtn={setMtn} />
      <Hero tod={tod} setTod={setTod} sceneStyle={sceneStyle} setSceneStyle={setSceneStyle} />
      <Ticker />
      <Deep tod={tod} mtn={mtn} />
      <TweaksPanel>
        <TweakSection label="Typography" />
        <TweakRadio label="Display typeface" value={t.displayFont}
          options={["Playfair Display", "Cormorant Garamond", "DM Serif Display"]}
          onChange={(v) => setTweak("displayFont", v)} />
        <TweakSection label="Glass & motion" />
        <TweakSlider label="Glass blur" value={t.glassBlur} min={4} max={28} step={1} unit="px"
          onChange={(v) => setTweak("glassBlur", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
